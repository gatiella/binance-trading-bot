# Enhanced Binance Trading Bot Configuration
# ============================================

binance:
  api_key: ""  # Will load from .env
  secret_key: ""  # Will load from .env
  testnet: true

telegram:
  bot_token: ""  # Will load from .env
  chat_id: ""  # Will load from .env
  enabled: true

strategy:
  # Position Management
  max_positions: 3
  position_size_usdt: 50.0
  
  # Risk Management
  stop_loss_percent: 2.0          # Base stop loss (will adjust based on ATR)
  take_profit_percent: 5.0        # Base take profit (will adjust based on signal strength)
  trailing_stop_percent: 1.5      # Initial trailing stop
  trailing_stop_enabled: true
  
  # Hot Coin Filters
  min_volume_usdt: 2000000.0      # $2M minimum volume (was $1M) - filters thin/noisy pairs
  min_price_change_percent: 5.0   # 5% minimum price change (was 3%) - real moves only
  
  # Signal Generation
  min_signal_strength: 0.75       # 75% floor under ALL regime thresholds (was unused/0.60)
  use_multi_timeframe: true       # Analyze multiple timeframes (RECOMMENDED)
  
  # Volume Confirmation
  require_volume_spike: true      # Require actual volume spike, not just high 24h volume
  volume_spike_multiplier: 2.0    # Volume must be 2x average (was 1.5x)
  
  # RSI Filters
  max_rsi_entry: 70               # Don't buy if RSI above this (was 75) - avoid late entries
  min_rsi_entry: 45               # Don't buy if RSI below this (was 40) - avoid weak momentum
  
  # Additional Filters
  require_ema_crossover: true     # Require EMA12 > EMA26 - confirms actual trend
  require_macd_positive: false    # Leave off for now - MACD already scored, not a hard gate

risk:
  max_daily_loss_usdt: 100.0      # Stop trading if daily loss exceeds this
  max_drawdown_percent: 10.0      # Maximum acceptable drawdown